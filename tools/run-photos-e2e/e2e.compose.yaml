name: nipt-run-photos-e2e-20261018
services:
  db:
    network_mode: bridge
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    ports: ["127.0.0.1:19729:5432"]
    environment:
      POSTGRES_USER: nipt_e2e
      POSTGRES_DB: nipt_synthetic_p2_browser_photos
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nipt_e2e -d nipt_synthetic_p2_browser_photos]
