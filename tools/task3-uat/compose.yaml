services:
  db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    network_mode: bridge
    ports: ["127.0.0.1:20129:5432"]
    environment:
      POSTGRES_USER: nipt_migrator
      POSTGRES_DB: nipt_task3_integrated_owner_uat
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nipt_migrator -d nipt_task3_integrated_owner_uat]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  database:
secrets:
  db_password: {file: .local/task3-uat/secrets/db-password}
