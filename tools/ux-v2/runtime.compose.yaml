name: nipt-ux-v2-local-20261017
x-common: &common
  environment: &common-env
    NIPT_MODE: operational
    NIPT_OPERATIONAL_DATABASE: nipt_operational_ux_v2_local
    APP_ORIGIN: https://127.0.0.1:19518
    FILE_STORE_ROOT: /files
    SIMULATOR_ROOT: /simulator
    RENDERER_URL: http://renderer:3001
    RENDERER_TOKEN_FILE: /run/secrets/renderer_token
    IDENTITY_LOOKUP_KEY_FILE: /run/secrets/identity_lookup
    NEXT_TELEMETRY_DISABLED: "1"
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped
services:
  db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    ports: ["127.0.0.1:19519:5432"]
    environment:
      POSTGRES_USER: nipt_migrator
      POSTGRES_DB: nipt_operational_ux_v2_local
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [database:/var/lib/postgresql/data]
    networks: [data,db-ingress]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nipt_migrator -d nipt_operational_ux_v2_local]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *common
    image: sha256:98020a4b8873c36ed863cc06aa7ab902106a27fd41c19879b0a2c98200c62dee
    environment:
      <<: *common-env
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_url
      WEB_DB_PASSWORD_FILE: /run/secrets/web_password
      WORKER_DB_PASSWORD_FILE: /run/secrets/worker_password
      NIPT_UAT_ACCOUNTS_FILE: /run/secrets/uat_accounts
    secrets: [migration_url,web_password,worker_password,uat_accounts]
    command: [node,--import,./tools/runtime-env.mjs,--import,tsx,tools/operational/prepare-home-operational.ts]
    depends_on: {db: {condition: service_healthy}}
    networks: [data]
    tmpfs: ["/tmp:rw,nosuid,size=64m"]
    read_only: true
    restart: "no"
  fixture-seed:
    <<: *common
    image: sha256:98020a4b8873c36ed863cc06aa7ab902106a27fd41c19879b0a2c98200c62dee
    environment:
      <<: *common-env
      NIPT_HOME_UAT_FIXTURE_ROOT: /app/.local/integrated-owner-uat/fixtures
      NIPT_HOME_UAT_SIMULATOR_ROOT: /app/.local/integrated-owner-uat/integration
    volumes:
      - type: bind
        source: .local/ux-v2/fixtures
        target: /app/.local/integrated-owner-uat/fixtures
      - type: bind
        source: .local/ux-v2/integration
        target: /app/.local/integrated-owner-uat/integration
    command: [node,--import,./tools/runtime-env.mjs,--import,tsx,tools/operational/seed-home-uat-fixtures.ts]
    networks: [data]
    tmpfs: ["/tmp:rw,nosuid,size=64m"]
    read_only: true
    restart: "no"
  renderer:
    <<: *common
    image: sha256:ea5baff3597f958bbe7b74b750020d6b1a51faaf94bbf321295b11416fc64ae8
    environment:
      <<: *common-env
      RENDERER_HOST: 0.0.0.0
      CHROMIUM_NO_SANDBOX: "true"
    secrets: [renderer_token]
    networks: [render]
    tmpfs: ["/tmp:rw,nosuid,size=512m"]
    read_only: true
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, "node -e \"const t=require('fs').readFileSync('/run/secrets/renderer_token','utf8').trim();fetch('http://127.0.0.1:3001/health',{headers:{authorization:'Bearer '+t}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *common
    image: sha256:98020a4b8873c36ed863cc06aa7ab902106a27fd41c19879b0a2c98200c62dee
    environment:
      <<: *common-env
      DATABASE_URL_FILE: /run/secrets/worker_url
      NIPT_HIS_SHARE_POLICY_FILE: /simulator/share-policy.json
      INTEGRATION_PRIVATE_KEY_FILE: /run/secrets/integration_private
    secrets: [worker_url,renderer_token,identity_lookup,integration_private]
    volumes:
      - type: bind
        source: .local/ux-v2/files
        target: /files
      - type: bind
        source: .local/ux-v2/integration
        target: /simulator
      - type: bind
        source: .local/ux-v2/positive-journey/outbound
        target: /outbound
    networks: [data,render]
    depends_on:
      migrate: {condition: service_completed_successfully}
      fixture-seed: {condition: service_completed_successfully}
      renderer: {condition: service_healthy}
    tmpfs: ["/tmp:rw,nosuid,size=128m"]
    read_only: true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
  web:
    <<: *common
    image: sha256:28fa3252d79acf15a6c6869dcd16d784da8481f0e92e38774d8c81e91100b6ea
    environment:
      <<: *common-env
      DATABASE_URL_FILE: /run/secrets/web_url
      INTEGRATION_PUBLIC_KEY_FILE: /run/secrets/integration_public
      NIPT_TASK_MASTER_PATH: /approved/master.xlsx
      NIPT_LOCAL_UAT_BANNER: "1"
      NIPT_NATIVE_EXCEL_SPOOL: /excel-spool
    secrets: [web_url,renderer_token,integration_public,identity_lookup]
    volumes:
      - type: bind
        source: .local/ux-v2/files
        target: /files
      - type: bind
        source: .local/ux-v2/integration
        target: /simulator
        read_only: true
      - type: bind
        source: .local/ux-v2/master/approved-combined.xlsx
        target: /approved/master.xlsx
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: .local/ux-v2/excel-spool
        target: /excel-spool
    networks: [data,render,proxy]
    depends_on:
      migrate: {condition: service_completed_successfully}
      fixture-seed: {condition: service_completed_successfully}
      renderer: {condition: service_healthy}
    tmpfs: ["/tmp:rw,nosuid,size=128m"]
    read_only: true
    mem_limit: 3g
    cpus: 3
    pids_limit: 384
  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports: ["127.0.0.1:19518:443"]
    volumes:
      - type: bind
        source: tools/ux-v2/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy:/data
    networks: [proxy,ingress]
    depends_on: [web]
    restart: unless-stopped
networks:
  data: {internal: true, ipam: {config: [{subnet: 10.237.38.0/28}]}}
  render: {internal: true, ipam: {config: [{subnet: 10.237.38.16/28}]}}
  proxy: {internal: true, ipam: {config: [{subnet: 10.237.38.32/28}]}}
  ingress:
    ipam: {config: [{subnet: 10.237.38.48/28}]}
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  db-ingress:
    ipam: {config: [{subnet: 10.237.38.64/28}]}
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
volumes:
  database:
  caddy:
secrets:
  db_password: {file: .local/ux-v2/secrets/db-password}
  migration_url: {file: .local/ux-v2/secrets/migration-url}
  web_url: {file: .local/ux-v2/secrets/web-url}
  worker_url: {file: .local/ux-v2/secrets/worker-url}
  web_password: {file: .local/ux-v2/secrets/web-password}
  worker_password: {file: .local/ux-v2/secrets/worker-password}
  uat_accounts: {file: .local/ux-v2/secrets/uat-accounts.json}
  renderer_token: {file: .local/ux-v2/secrets/renderer-token}
  identity_lookup: {file: .local/ux-v2/secrets/identity-lookup.key}
  integration_public: {file: .local/ux-v2/secrets/integration-public.pem}
  integration_private: {file: .local/ux-v2/secrets/integration-private.pem}
